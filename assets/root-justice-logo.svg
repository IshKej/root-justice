<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120" width="1000" height="1120" role="img" aria-label="Root Justice logo">
  <title>Root Justice</title>
  <desc>A fingerprint formed from concentric angular ridges with a red circuit trace and node, above the ROOT JUSTICE wordmark.</desc>
  <style>
    .ridge { fill: none; stroke: #111418; stroke-width: 42; stroke-linejoin: miter; stroke-linecap: butt; }
    .trace { fill: none; stroke: #e11324; stroke-width: 42; stroke-linejoin: miter; stroke-linecap: round; }
    .ink   { fill: #111418; }
    .red   { fill: #e11324; }
    @media (prefers-color-scheme: dark) {
      .ridge { stroke: #f4f6f8; }
      .ink   { fill: #f4f6f8; }
    }
    :root[data-theme="dark"] .ridge { stroke: #f4f6f8; }
    :root[data-theme="dark"] .ink   { fill: #f4f6f8; }
  </style>

  <!-- Concentric angular fingerprint ridges (outer -> inner) -->
  <path class="ridge" d="M250 940 V380 L360 190 H640 L750 380 V940" />
  <path class="ridge" d="M340 940 V430 L430 275 H570 L660 430 V720" />
  <path class="ridge" d="M430 940 V480 L498 360 H560 L600 460" />

  <!-- Red circuit trace: node at center, routed down-left -->
  <path class="trace" d="M500 560 V720 L410 900" />
  <circle class="red" cx="500" cy="540" r="52" />

  <!-- Terminal glyph ">_" cut into the lower center -->
  <path class="ink" d="M560 835 l70 42 l-70 42 v-34 l18 -8 l-18 -8 z" />
  <rect class="ink" x="648" y="905" width="70" height="20" />

  <!-- Wordmark (textLength pins it inside the canvas so it never clips) -->
  <text x="500" y="1050" text-anchor="middle" class="ink"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="120" font-weight="900"
        textLength="860" lengthAdjust="spacingAndGlyphs">ROOT JUSTICE</text>
  <!-- Red underline -->
  <polygon class="red" points="120,1082 880,1082 862,1104 138,1104" />
</svg>
